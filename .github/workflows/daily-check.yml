name: Controllo giornaliero tassi mutuo

on:
  schedule:
    # 06:30 UTC = 08:30 (CEST) / 07:30 (CET) ora italiana
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia solo un messaggio di test su Telegram (per verificare la configurazione)"
        type: boolean
        default: false

permissions:
  contents: write

# Evita che due esecuzioni sovrapposte (es. avvio manuale + cron, o due
# avvii manuali ravvicinati) tentino di fare "git push" nello stesso momento.
concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rate check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: python scripts/update_and_check.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git diff --quiet --cached || git commit -m "Aggiornamento dati tassi $(date -u +'%Y-%m-%d')"
          # Se nel frattempo il branch remoto è avanzato (es. un push manuale
          # quasi in contemporanea), riallinea prima di riprovare il push.
          git pull --rebase origin main
          git push
